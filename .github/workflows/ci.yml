# Continuous integration: lint, type-check, unit + integration tests on local Spark,
# build the wheel, and validate the bundle configuration.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required by local PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (locked)
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term

      - name: Integration test (full medallion run on local Spark)
        run: uv run pytest -m integration

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: energy_lakehouse-wheel
          path: dist/*.whl
          if-no-files-found: error

  bundle-schema:
    name: Bundle config against CLI JSON schema (no workspace needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - name: Validate YAML against `databricks bundle schema`
        run: uv run python scripts/check_bundle_schema.py

  bundle-validate:
    # Full `databricks bundle validate` resolves ${workspace.current_user...} and needs a
    # workspace. Runs only when the repository has DATABRICKS_HOST configured.
    name: databricks bundle validate (dev)
    if: ${{ vars.DATABRICKS_HOST != '' }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # workload identity federation (OIDC), no stored secret
      contents: read
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - uses: astral-sh/setup-uv@v6
      - run: databricks bundle validate -t dev
